[project]
name = "von-sdk"
version = "1.2.0"
description = "Von - The open-source System One decision model. Sub-25ms, local, calibrated decision primitives in homage to John von Neumann and Ludwig von Mises."
authors = [
    { name = "Victor Hugo", email = "victor.panisa@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0,<2.14.0",
    "transformers>=5.0.0",
    "accelerate>=0.26.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/wfzyx/von"
Issues = "https://github.com/wfzyx/von/issues"

[project.scripts]
von = "von.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]
intel = [
    "openvino>=2025.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/von"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",
]

[tool.uv.sources]
torch = { index = "ibm" }

[[tool.uv.index]]
name = "ibm"
url = "https://wheels.developerfirst.ibm.com/ppc64le/linux"
explicit = true
